name: Terraform Apply

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  apply-staging:
    name: "Terraform Apply Staging"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_db_url: ${{ secrets.DB_URL }}
          TF_VAR_clerk_jwt_issuer_uri: ${{ vars.CLERK_JWT_ISSUER_URI }}
          TF_VAR_firebase_service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

  apply-prod:
    name: "Terraform Apply Prod"
    runs-on: ubuntu-latest
    needs: apply-staging
    defaults:
      run:
        working-directory: ./prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init
      
      - name: Import Existing Firebase Site
        run: terraform import module.app.google_firebase_hosting_site.frontend projects/ringsatranarvi/sites/prod-ringsatranarvi-app || true
        env:
          TF_VAR_db_url: ${{ secrets.DB_URL }}
          TF_VAR_clerk_jwt_issuer_uri: ${{ vars.CLERK_JWT_ISSUER_URI }}
          TF_VAR_firebase_service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
                
      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_db_url: ${{ secrets.DB_URL }}
          TF_VAR_clerk_jwt_issuer_uri: ${{ vars.CLERK_JWT_ISSUER_URI }}
          TF_VAR_firebase_service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
